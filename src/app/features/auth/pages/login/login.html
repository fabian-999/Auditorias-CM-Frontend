<main class="relative min-h-screen overflow-hidden bg-slate-50 text-slate-900">
  <div class="pointer-events-none absolute left-0 top-0 h-72 w-72 rounded-full bg-slate-400/10 blur-3xl"></div>
  <div class="pointer-events-none absolute right-0 top-20 h-72 w-72 rounded-full bg-white/70 blur-3xl"></div>
  <div class="pointer-events-none absolute left-1/2 top-1/3 h-96 w-96 -translate-x-1/2 rounded-full border border-slate-200/80 bg-white/80 blur-2xl"></div>

  <div class="relative flex min-h-screen items-center justify-center px-4 py-10 sm:px-6">
    <section class="grid w-full max-w-5xl overflow-hidden rounded-[2rem] border border-emerald-100/90 bg-white shadow-[0_25px_120px_-50px_rgba(15,23,42,0.15)] backdrop-blur-xl lg:grid-cols-2">

      <div class="relative hidden overflow-hidden bg-gradient-to-br from-white via-emerald-50 to-emerald-100 p-12 lg:flex lg:flex-col lg:justify-center lg:items-center">
        <div class="absolute -right-16 -top-16 h-64 w-64 rounded-full border border-emerald-200/40 bg-emerald-200/20"></div>
        <div class="absolute -bottom-16 -left-16 h-64 w-64 rounded-full border border-emerald-200/40 bg-emerald-100/40"></div>
        <div class="absolute left-6 top-28 h-12 w-32 rounded-full bg-emerald-300/15 blur-xl"></div>
        <div class="absolute right-10 top-52 h-14 w-36 rounded-full bg-white/80 blur-xl"></div>
        <div class="absolute left-16 bottom-28 h-16 w-40 rounded-full border border-emerald-200/40 bg-emerald-200/10"></div>
        <div class="absolute -left-6 top-6 h-10 w-24 rounded-full bg-emerald-200/20"></div>

        <div class="relative z-10 flex flex-col items-center gap-6 text-center">
          <img src="/imagenes/favicon-cm-2.png" alt="CM Colombia" class="h-[300px] w-[300px] object-contain bg-transparent shadow-none" />
          <div>
            <h2 class="text-4xl font-black uppercase tracking-tight text-slate-900">Control de Auditorias</h2>
          </div>
        </div>

        <div class="relative z-10 mt-10 max-w-xs text-center">
          <h1 class="text-4xl font-black leading-tight text-slate-900">Auditoría confiable</h1>
          <p class="mt-4 text-base leading-7 text-slate-600">Control centralizado para dispensarios con una interfaz limpia y profesional.</p>
        </div>
      </div>

      <div class="flex items-center bg-white px-8 py-10 sm:px-12 sm:py-14">
        <div class="mx-auto w-full max-w-md">
          <div class="mb-10">
            <h2 class="text-4xl font-black tracking-tight text-slate-900">Inicia sesión</h2>
            <p class="mt-3 text-base leading-7 text-slate-600">Accede a tu panel de auditorías con seguridad y claridad.</p>
          </div>

          <form class="space-y-5" (submit)="iniciarSesion(); $event.preventDefault()">
            <div>
              <label for="email" class="mb-2 block text-sm font-semibold text-slate-900">Correo electrónico</label>
              <div class="relative">
                <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4 text-emerald-600">
                  <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M3 7.5 10.54 13a2.5 2.5 0 0 0 2.92 0L21 7.5M5.5 19h13A2.5 2.5 0 0 0 21 16.5v-9A2.5 2.5 0 0 0 18.5 5h-13A2.5 2.5 0 0 0 3 7.5v9A2.5 2.5 0 0 0 5.5 19Z" /></svg>
                </div>
                <input id="email" name="email" type="email" autocomplete="email" placeholder="nombre@correo.com" class="w-full rounded-[1.75rem] border border-slate-300 bg-slate-50 py-4 pl-14 pr-4 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 hover:border-emerald-300 focus:border-emerald-500 focus:ring-4 focus:ring-emerald-100" />
              </div>
            </div>

            <div>
              <div class="mb-2 flex items-center justify-between gap-4">
                <label for="password" class="block text-sm font-semibold text-slate-700">Contraseña</label>
                <a href="/recuperar-contrasena" class="text-xs font-semibold text-emerald-600 transition hover:text-emerald-800">¿Olvidaste tu contraseña?</a>
              </div>
              <div class="relative">
                <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">
                  <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2" /><path stroke-linecap="round" d="M8 10V7a4 4 0 0 1 8 0v3" /></svg>
                </div>
                <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Ingresa tu contraseña" class="w-full rounded-[1.75rem] border border-slate-300 bg-slate-50 py-4 pl-14 pr-4 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 hover:border-emerald-300 focus:border-emerald-500 focus:ring-4 focus:ring-emerald-100" />
              </div>
            </div>

            <label class="flex cursor-pointer items-center gap-3 text-sm text-slate-600">
              <input type="checkbox" name="rememberMe" class="h-4 w-4 rounded border-slate-300 bg-white text-slate-900 focus:ring-emerald-400" />
              <span>Recordar sesión</span>
            </label>

            <button type="submit" class="group flex w-full items-center justify-center gap-2 rounded-[1.75rem] bg-emerald-600 px-6 py-4 text-sm font-semibold text-white shadow-[0_26px_95px_-35px_rgba(16,185,129,0.85)] transition duration-300 hover:bg-emerald-700 hover:-translate-y-0.5 hover:shadow-xl">
              <span>Iniciar sesión</span>
              <svg class="h-4 w-4 transition-transform group-hover:translate-x-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="m9 18 6-6-6-6" /></svg>
            </button>
          </form>

          <div class="my-8 flex items-center gap-4">
            <div class="h-px flex-1 bg-emerald-100"></div>
            <span class="text-xs uppercase tracking-wider text-emerald-600">O continúa con</span>
            <div class="h-px flex-1 bg-emerald-100"></div>
          </div>

          <button type="button" class="group mb-6 flex w-full items-center justify-center gap-3 rounded-[1.75rem] border border-emerald-200 bg-emerald-50 px-6 py-4 text-sm font-semibold text-slate-900 transition hover:bg-emerald-100">
            <span class="inline-flex h-8 w-8 items-center justify-center rounded-full bg-white text-emerald-600">
              <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M21 12.3c0-.8-.1-1.6-.3-2.3H12v4.4h5.3c-.2 1.2-.8 2.1-1.6 2.8v2.3h2.6c1.5-1.4 2.4-3.5 2.4-6.2z" />
                <path d="M12 22c2.4 0 4.4-.8 5.9-2.2l-2.6-2.3c-.7.5-1.6.9-3.3.9-2.6 0-4.8-1.8-5.6-4.1H3.7v2.6C5.2 19.9 8.3 22 12 22z" />
                <path d="M6.4 13.4c-.2-.6-.3-1.2-.3-1.9s.1-1.3.3-1.9V7.1H3.7C3 8.5 2.7 10.1 2.7 12s.3 3.5 1 4.9l2.7-2.5z" />
                <path d="M12 5.1c1.3 0 2.4.4 3.3 1.2l2.4-2.3C16.4 2.7 14.4 2 12 2 8.3 2 5.2 4.1 3.7 7.1l2.7 2.6c.8-2.3 3-4.1 5.6-4.1z" />
              </svg>
            </span>
            <span>Continuar con Google</span>
          </button>

          <p class="mt-2 text-center text-sm text-slate-500">¿No tienes una cuenta?
            <a href="/registro" class="ml-1 font-semibold text-emerald-700 transition hover:text-emerald-900">Crear cuenta</a>
          </p>
        </div>
      </div>
    </section>
  </div>
</main>
